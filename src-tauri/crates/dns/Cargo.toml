[package]
name = "forceconnect-dns"
description = "DNS server catalog, rules, and forwarder for ForceConnect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
default = []
# Lets the Tauri app export these types to TypeScript without this crate
# depending on Tauri itself.
specta = ["dep:specta"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
specta = { workspace = true, optional = true, features = ["derive"] }

hickory-proto.workspace = true
hickory-resolver.workspace = true
tokio = { workspace = true, features = ["rt", "time", "net", "sync", "macros"] }
futures-util = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[package]
name = "forceconnect-privileged"
description = "The operations ForceConnect needs administrator rights for"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# A library, not a binary. Every privileged operation the application performs
# lives in this crate and nowhere else, so "what does ForceConnect do with
# administrator rights" is answered by reading four files.
#
# It stays a separate crate rather than a module of the Tauri app because a test
# harness linked against the app crate does not load on Windows (see the note at
# the foot of `src-tauri/src/lib.rs`). Here `cargo test` works normally.

[dependencies]
forceconnect-net.workspace = true

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }

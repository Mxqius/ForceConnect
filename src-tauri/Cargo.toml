[workspace]
members = ["crates/dns", "crates/net", "crates/privileged"]

[workspace.package]
version = "2.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/mxqius/forceconnect"
authors = ["Mxqius"]

[workspace.dependencies]
forceconnect-dns = { path = "crates/dns" }
forceconnect-net = { path = "crates/net" }
forceconnect-privileged = { path = "crates/privileged" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tokio = "1.53"
specta = "=2.0.0-rc.25"
windows = "0.62"

# The DNS engine. `hickory-net` carries the transports in 0.26 — they moved out
# of hickory-proto — and its features are what the resolver forwards.
#
# `default-features = false` on the resolver is important: its default pulls in
# `system-config`, which reads the machine's configured DNS. We are the thing
# setting that, and once connected it points at 127.0.0.1, so consulting it
# would be circular.
hickory-proto = "0.26.1"
hickory-net = "0.26.1"
# The listener half. Provides the UDP/TCP plumbing — TCP length framing,
# per-connection timeouts, EDNS and truncation — which is a week of subtle bugs
# to reimplement.
hickory-server = { version = "0.26.1", default-features = false, features = [
    "resolver",
] }
hickory-resolver = { version = "0.26.1", default-features = false, features = [
    "tokio",
    "tls-ring",
    "https-ring",
    "quic-ring",
    "h3-ring",
    # Uses the platform trust store — Windows' certificate store, the macOS
    # keychain, the distribution's CA bundle on Linux — so corporate
    # TLS-inspection proxies and enterprise roots work, and root updates arrive
    # with OS updates rather than needing a release from us. Do not also enable
    # `webpki-roots`: this short-circuits it, and the frozen Mozilla list would
    # be dead weight that hard-fails behind any inspecting proxy.
    "rustls-platform-verifier",
] }

[package]
name = "forceconnect"
description = "A fast, modern DNS manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the library name from colliding with the binary name
# on Windows. See rust-lang/cargo#8519.
name = "forceconnect_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
forceconnect-net.workspace = true
# The only crate in the workspace that changes system state. Depending on it
# from here is what makes this one application instead of two; the boundary it
# used to be enforced by is now a crate boundary and a short, enumerated API.
forceconnect-privileged.workspace = true
# Without the `specta` feature: the frontend contract is defined by the DTOs in
# `commands/`, not by the internal catalog types. Exporting those directly would
# leak serde's optional-field handling into TypeScript as a pair of
# `_Serialize`/`_Deserialize` variants.
forceconnect-dns.workspace = true

tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"

serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
# tauri-plugin-log's level filter is expressed in `log` types.
log = "0.4"
# Bounded concurrency for the latency prober. Tauri owns the runtime, so there
# is no direct tokio dependency here — only the stream combinators.
futures-util = "0.3"

# The Tauri 2 line of specta is still tagged rc upstream but is the standard
# type-generation stack for Tauri 2. Pinned exactly so a contributor's build
# cannot drift onto a different rc.
specta.workspace = true
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }

# No direct `windows` or `libc` dependency. This crate is the Tauri shell: it
# wires commands to the frontend and owns no platform calls of its own.
# Everything that touches the platform lives in `crates/`, which is what keeps
# "what does this app do with administrator rights" answerable by reading one
# small crate.
#
# The single exception is the webview's own memory target in compact mode (see
# `src/window.rs`): a COM call on this process's WebView2, not on the system.
# Both versions are pinned to the ones wry already links, so this adds no new
# copies of either crate.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

# Single-instance and window-state are desktop-only.
[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Signed, self-contained updates. `rustls-tls` rather than the default
# native-tls: the rest of the app already validates TLS through rustls with the
# platform trust store, and linking a second TLS stack into the binary to fetch
# one JSON file is not worth the size.
tauri-plugin-updater = { version = "2", default-features = false, features = [
    "rustls-tls",
] }
tauri-plugin-window-state = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

name: Release

# Push a `v*` tag and this builds the app and publishes a GitHub release with
# the installers attached. Free on public repos; needs no secrets beyond the
# built-in GITHUB_TOKEN.
#
#   git tag v2.0.1 && git push origin v2.0.1
#
# Each platform builds the formats listed in its own config: NSIS from
# tauri.conf.json on Windows, `.app` + `.dmg` from tauri.macos.conf.json, and
# `.deb` + `.rpm` + AppImage from tauri.linux.conf.json. The macOS build is
# universal (Apple Silicon and Intel in one binary) and ad-hoc signed, not
# notarized — see RELEASING.md.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # 22.04 rather than latest: the AppImage and .deb link against the
          # runner's glibc and WebKitGTK, so the oldest supported runner gives
          # the widest range of distributions they install on.
          - name: Linux
            os: ubuntu-22.04
            args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # The release description lives in the repository, one file per tag, so
      # it is written and reviewed like any other change. A tag without one
      # falls back to the short download note.
      - name: Read release notes
        id: notes
        shell: bash
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          {
            echo 'body<<RELEASE_NOTES_EOF'
            if [ -f "$file" ]; then
              cat "$file"
            else
              echo "Download the installer for your platform from the assets below."
            fi
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Add these once auto-update signing is set up (see RELEASING.md):
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ForceConnect ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
